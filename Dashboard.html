<script>
        // Estado local temporal que se sincroniza con el servidor
        let db = {
            pacientes: [],
            citas: [],
            historias: [],
            informes: []
        };

        // Cargar datos del servidor al iniciar la página
        window.onload = function() {
            cargarDatosServidor();
        };

        // Obtener todos los registros desde el servidor SQLite
        async function cargarDatosServidor() {
            try {
                const response = await fetch('/api/db');
                if (response.ok) {
                    db = await response.json();
                    actualizarSelects();
                    actualizarDashboard();
                    actualizarTablasGestion();
                } else {
                    console.error('Error al cargar los datos del servidor');
                }
            } catch (error) {
                console.error('Error de red al conectar con el servidor:', error);
            }
        }

        function switchTab(tabId) {
            const sections = ['dashboard', 'pacientes', 'citas', 'historias', 'informes'];
            sections.forEach(sec => {
                document.getElementById(`view-${sec}`).classList.add('hidden');
                document.getElementById(`btn-${sec}`).classList.remove('bg-rose-600', 'text-white', 'shadow-lg', 'shadow-rose-950/40', 'font-medium');
                document.getElementById(`btn-${sec}`).classList.add('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
            });

            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            activeBtn.classList.remove('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
            activeBtn.classList.add('bg-rose-600', 'text-white', 'shadow-lg', 'shadow-rose-950/40', 'font-medium');

            const titles = {
                'dashboard': 'Dashboard General',
                'pacientes': 'Registro de Pacientes',
                'citas': 'Agenda de Citas',
                'historias': 'Historias Clínicas',
                'informes': 'Informes Psicológicos'
            };
            document.getElementById('current-title').innerText = titles[tabId];
            actualizarTablasGestion();
        }

        function actualizarSelects() {
            const pSelects = ['c-paciente', 'h-paciente', 'i-paciente'];
            pSelects.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.innerHTML = '';
                    db.pacientes.forEach(p => {
                        let opt = document.createElement('option');
                        opt.value = p.nombre;
                        opt.textContent = `${p.nombre} (${p.dni})`;
                        el.appendChild(opt);
                    });
                }
            });
        }

        function actualizarDashboard() {
            document.getElementById('stat-pacientes').innerText = db.pacientes.length;
            document.getElementById('stat-citas').innerText = db.citas.length;
            document.getElementById('stat-historias').innerText = db.historias.length;
            document.getElementById('stat-informes').innerText = db.informes.length;

            let pList = document.getElementById('dashboard-pacientes-list');
            if(pList) {
                pList.innerHTML = '';
                db.pacientes.slice(-3).reverse().forEach(p => {
                    pList.innerHTML += `
                        <tr class="border-b border-slate-50">
                            <td class="py-3 px-3 font-semibold text-slate-700">${p.dni}</td>
                            <td class="py-3 px-3 text-slate-600">${p.nombre}</td>
                            <td class="py-3 px-3 text-right">
                                <button onclick="switchTab('pacientes')" class="text-rose-600 hover:text-rose-800 font-semibold text-xs">Ver</button>
                            </td>
                        </tr>
                    `;
                });
            }

            let cList = document.getElementById('dashboard-citas-list');
            if(cList) {
                cList.innerHTML = '';
                db.citas.slice(-3).reverse().forEach(c => {
                    cList.innerHTML += `
                        <tr class="border-b border-slate-50">
                            <td class="py-3 px-3 font-semibold text-slate-700">${c.paciente}</td>
                            <td class="py-3 px-3 text-slate-600">${c.medico}</td>
                            <td class="py-3 px-3 text-slate-600 text-xs">${c.fecha}</td>
                            <td class="py-3 px-3"><span class="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-bold">${c.estado}</span></td>
                        </tr>
                    `;
                });
            }
        }

        function actualizarTablasGestion() {
            let tPacientes = document.getElementById('tabla-gestion-pacientes');
            if(tPacientes) {
                tPacientes.innerHTML = '';
                db.pacientes.forEach((p) => {
                    tPacientes.innerHTML += `
                        <tr class="border-b border-slate-100">
                            <td class="py-3 px-3 font-semibold">${p.dni}</td>
                            <td class="py-3 px-3">${p.nombre}</td>
                            <td class="py-3 px-3">${p.tel}</td>
                            <td class="py-3 px-3">${p.email}</td>
                            <td class="py-3 px-3 text-right">
                                <button onclick="eliminarRegistro('pacientes', ${p.id})" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-all">
                                    <i class="fa-solid fa-trash"></i> Eliminar
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            let tCitas = document.getElementById('tabla-gestion-citas');
            if(tCitas) {
                tCitas.innerHTML = '';
                db.citas.forEach((c) => {
                    tCitas.innerHTML += `
                        <tr class="border-b border-slate-100">
                            <td class="py-3 px-3 font-semibold">${c.paciente}</td>
                            <td class="py-3 px-3">${c.medico}</td>
                            <td class="py-3 px-3">${c.fecha}</td>
                            <td class="py-3 px-3">${c.estado}</td>
                            <td class="py-3 px-3 text-right">
                                <button onclick="eliminarRegistro('citas', ${c.id})" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-all">
                                    <i class="fa-solid fa-trash"></i> Eliminar
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            let tHistorias = document.getElementById('tabla-gestion-historias');
            if(tHistorias) {
                tHistorias.innerHTML = '';
                db.historias.forEach((h, index) => {
                    tHistorias.innerHTML += `
                        <tr class="border-b border-slate-100">
                            <td class="py-3 px-3 font-semibold">${h.paciente}</td>
                            <td class="py-3 px-3">${h.diagnostico}</td>
                            <td class="py-3 px-3">${h.tratamiento}</td>
                            <td class="py-3 px-3 text-right space-x-1">
                                <button onclick="generarPDFHistoria(${index})" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-all">
                                    <i class="fa-solid fa-file-pdf"></i> PDF
                                </button>
                                <button onclick="eliminarRegistro('historias', ${h.id})" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-all">
                                    <i class="fa-solid fa-trash"></i> Eliminar
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            let tInformes = document.getElementById('tabla-gestion-informes');
            if(tInformes) {
                tInformes.innerHTML = '';
                db.informes.forEach((i) => {
                    tInformes.innerHTML += `
                        <tr class="border-b border-slate-100">
                            <td class="py-3 px-3 font-semibold">${i.paciente}</td>
                            <td class="py-3 px-3">${i.contenido}</td>
                            <td class="py-3 px-3 text-right">
                                <button onclick="eliminarRegistro('informes', ${i.id})" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-all">
                                    <i class="fa-solid fa-trash"></i> Eliminar
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        function generarPDFHistoria(index) {
            const h = db.historias[index];
            const ventanaPDF = window.open('', '_blank');
            ventanaPDF.document.write(`
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>Historia Clínica - ${h.paciente}</title>
                    <style>
                        body { font-family: system-ui, -apple-system, sans-serif; color: #1e293b; padding: 40px; margin: 0; background: #ffffff; }
                        .contenedor { max-width: 42rem; margin: 0 auto; border: 1px solid #e2e8f0; padding: 32px; border-radius: 16px; }
                        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px; }
                        h1 { font-size: 1.25rem; font-weight: bold; margin: 0; color: #0f172a; }
                        p { margin: 4px 0; font-size: 0.875rem; color: #64748b; }
                        .text-right { text-align: right; }
                        .uppercase { text-transform: uppercase; font-size: 0.75rem; font-weight: bold; color: #e11d48; }
                        .space-y > div + div { margin-top: 16px; }
                        .label { font-weight: bold; color: #475569; font-size: 0.875rem; display: block; margin-bottom: 4px; }
                        .box { background: #f8fafc; padding: 12px 16px; border-radius: 12px; border: 1px solid #f1f5f9; color: #0f172a; font-size: 0.875rem; }
                        .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #94a3b8; }
                        .btn { background: #0f172a; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
                        @media print {
                            .btn { display: none; }
                            body { padding: 0; }
                            .contenedor { border: none; }
                        }
                    </style>
                </head>
                <body>
                    <div class="contenedor">
                        <div class="header">
                            <div>
                                <h1>Psic. Isabel Daza</h1>
                                <p>Psicología Clínica Integral</p>
                            </div>
                            <div class="text-right">
                                <p class="uppercase">Historia Clínica</p>
                                <p>Fecha de emisión: ${new Date().toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div class="space-y">
                            <div>
                                <span class="label">Paciente:</span>
                                <div class="box">${h.paciente}</div>
                            </div>
                            <div>
                                <span class="label">Diagnóstico Psicológico:</span>
                                <div class="box">${h.diagnostico}</div>
                            </div>
                            <div>
                                <span class="label">Plan Terapéutico e Indicaciones:</span>
                                <div class="box">${h.tratamiento}</div>
                            </div>
                        </div>
                        <div class="footer">
                            <p>Documento generado digitalmente - Sistema Clínico</p>
                            <button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button>
                        </div>
                    </div>
                </body>
                </html>
            `);
            ventanaPDF.document.close();
        }

        // Eliminar registro enviando petición DELETE al servidor
        async function eliminarRegistro(tabla, id) {
            try {
                const response = await fetch(`/api/${tabla}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    cargarDatosServidor();
                } else {
                    alert('No se pudo eliminar el registro');
                }
            } catch (error) {
                console.error('Error al eliminar:', error);
            }
        }

        // Funciones de registro conectadas por POST al servidor SQLite
        async function registrarPaciente(e) {
            e.preventDefault();
            let nuevoP = {
                nombre: document.getElementById('p-nombre').value + ' ' + document.getElementById('p-apellido').value,
                dni: document.getElementById('p-dni').value,
                tel: document.getElementById('p-tel').value,
                email: document.getElementById('p-email').value
            };

            await fetch('/api/pacientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoP)
            });

            document.getElementById('form-paciente').reset();
            await cargarDatosServidor();
            switchTab('citas');
        }

        async function agendarCita(e) {
            e.preventDefault();
            let nuevaC = {
                paciente: document.getElementById('c-paciente').value,
                medico: document.getElementById('c-medico').value,
                fecha: document.getElementById('c-fecha').value.replace('T', ' '),
                estado: 'Confirmada'
            };

            await fetch('/api/citas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevaC)
            });

            document.getElementById('form-cita').reset();
            await cargarDatosServidor();
            switchTab('historias');
        }

        async function registrarHistoria(e) {
            e.preventDefault();
            let nuevaH = {
                paciente: document.getElementById('h-paciente').value,
                diagnostico: document.getElementById('h-diagnostico').value,
                tratamiento: document.getElementById('h-tratamiento').value
            };

            await fetch('/api/historias', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevaH)
            });

            document.getElementById('form-historia').reset();
            await cargarDatosServidor();
            switchTab('informes');
        }

        async function generarInforme(e) {
            e.preventDefault();
            let nuevoI = {
                paciente: document.getElementById('i-paciente').value,
                contenido: document.getElementById('i-contenido').value
            };

            await fetch('/api/informes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoI)
            });

            document.getElementById('form-informe').reset();
            await cargarDatosServidor();
            switchTab('dashboard');
            alert('¡Informe psicológico generado y guardado en la base de datos con éxito!');
        }
    </script>
